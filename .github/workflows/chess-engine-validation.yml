name: Chess engine validation

on:
  push:
    branches: [premium-engine-ui, fix-mobile-engine-arrows]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate chess engine JavaScript
        run: node scripts/validate-engine.mjs
      - name: Build Next.js application
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: |
          npm install
          npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/smoke-engine.mjs
